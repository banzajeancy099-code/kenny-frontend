<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenny — Chat IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --violet-300: #c4b5fd;
      --violet-500: #8b5cf6;
      --violet-700: #6d28d9;
      --noir: #06030d;
      --bordure: rgba(139, 92, 246, 0.15);
      --texte: #ffffff;
      --texte-dim: rgba(255, 255, 255, 0.6);
      --texte-faint: rgba(255, 255, 255, 0.4);
      --transition: cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--noir);
      color: var(--texte);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(6, 3, 13, 0.8);
      border-bottom: 1px solid var(--bordure);
      backdrop-filter: blur(20px);
    }

    .logo-svg {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.6));
    }

    .logo-text {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--violet-300));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27c93f;
      margin-left: auto;
      box-shadow: 0 0 10px #27c93f;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* CHAT CONTAINER */
    .chat-container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: calc(100vh - 70px);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-right: 8px;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.3);
      border-radius: 3px;
    }

    .msg {
      display: flex;
      gap: 12px;
      animation: msgApparait 0.3s var(--transition);
    }

    .msg.user { justify-content: flex-end; }

    @keyframes msgApparait {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }

    .msg-avatar.ia {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--violet-500);
      color: var(--violet-300);
    }

    .msg-avatar.user {
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      color: white;
      font-weight: 700;
    }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 75%;
      word-wrap: break-word;
    }

    .msg.ia .msg-bubble {
      background: rgba(26, 11, 46, 0.6);
      border: 1px solid var(--bordure);
      border-bottom-left-radius: 4px;
    }

    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 4px;
      padding: 16px 18px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--violet-300);
      animation: typing 1.4s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    /* INPUT */
    .chat-input-container {
      display: flex;
      gap: 10px;
      padding: 12px;
      background: rgba(26, 11, 46, 0.5);
      border: 1px solid var(--bordure);
      border-radius: 16px;
      backdrop-filter: blur(20px);
    }

    .chat-input-container input {
      flex: 1;
      padding: 12px 16px;
      background: transparent;
      border: none;
      color: var(--texte);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      min-width: 0;
    }

    .chat-input-container input::placeholder { color: var(--texte-faint); }

    .chat-input-container button {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s var(--transition);
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input-container button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.6);
    }

    .chat-input-container button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .chat-input-container button svg {
      width: 18px;
      height: 18px;
    }

    /* Welcome */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: var(--texte-dim);
    }

    .welcome h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff, var(--violet-300));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      font-size: 0.9rem;
      line-height: 1.6;
    }

  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <svg class="logo-svg" viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#a78bfa"/>
          <stop offset="100%" stop-color="#6d28d9"/>
        </linearGradient>
        <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#c4b5fd"/>
          <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
      </defs>
      <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#grad1)"/>
      <path d="M30 25 L30 75 M30 50 L50 50 L70 25 M50 50 L70 75" 
            stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="logo-text">Kenny</span>
    <div class="status-dot"></div>
  </header>

  <!-- CHAT -->
  <div class="chat-container">
    <div class="chat-messages" id="messages">
      <div class="welcome">
        <h2>👋 Bienvenue sur Kenny</h2>
        <p>Décris-moi l'application que tu veux créer et je m'occupe de tout.</p>
      </div>
    </div>

    <div class="chat-input-container">
      <input 
        type="text" 
        id="messageInput" 
        placeholder="Décris ton app..."
        autocomplete="off"
      >
      <button id="sendBtn">
        Envoyer
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m22 2-7 20-4-9-9-4Z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const API_URL = 'https://kenny-backend-lx76.onrender.com';
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    let isLoading = false;

    // Envoyer un message
    async function envoyerMessage() {
      const message = inputEl.value.trim();
      if (!message || isLoading) return;

      isLoading = true;
      inputEl.value = '';
      sendBtn.disabled = true;

      // Masquer le welcome
      const welcome = document.querySelector('.welcome');
      if (welcome) welcome.remove();

      // Afficher le message utilisateur
      ajouterMessage(message, 'user');

      // Afficher l'indicateur de frappe
      const typingId = afficherTyping();

      try {
        const response = await fetch(`${API_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        
        // Retirer le typing
        document.getElementById(typingId).remove();

        // Afficher la réponse
        ajouterMessage(data.response, 'ia');

      } catch (error) {
        document.getElementById(typingId)?.remove();
        ajouterMessage('❌ Erreur de connexion. Le serveur se réveille peut-être... Réessaie dans 30 secondes.', 'ia');
      }

      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    // Ajouter un message
    function ajouterMessage(texte, type) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      
      const avatar = type === 'ia' ? '🤖' : 'K';
      
      msg.innerHTML = `
        <div class="msg-avatar ${type}">${avatar}</div>
        <div class="msg-bubble">${escapeHtml(texte)}</div>
      `;
      
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Indicateur de frappe
    function afficherTyping() {
      const id = 'typing-' + Date.now();
      const msg = document.createElement('div');
      msg.className = 'msg ia';
      msg.id = id;
      msg.innerHTML = `
        <div class="msg-avatar ia">🤖</div>
        <div class="msg-bubble typing">
          <span></span><span></span><span></span>
        </div>
      `;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return id;
    }

    // Sécurité XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    sendBtn.addEventListener('click', envoyerMessage);
    inputEl.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') envoyerMessage();
    });
  </script>

</body>
</html>
