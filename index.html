<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenny App - Crée ton app</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <div class="max-w-4xl mx-auto p-8">

    <header class="text-center mb-12">
      <h1 class="text-5xl font-bold mb-4">🚀 Kenny App</h1>
      <p class="text-gray-400 text-xl">Décris ton app. L'IA la crée.</p>
    </header>

    <div class="bg-gray-800 rounded-lg p-6 mb-8">
      <label class="block text-sm font-semibold mb-2">
        Décris ton app
      </label>
      <textarea 
        id="prompt" 
        rows="5"
        class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-white focus:outline-none focus:border-blue-500"
        placeholder="Ex: Crée une app de livraison avec paiement..."
      ></textarea>
      
      <button 
        id="creer"
        class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition">
        ✨ Créer mon app
      </button>
    </div>

    <div id="resultat" class="bg-gray-800 rounded-lg p-6 hidden">
      <h2 class="text-2xl font-bold mb-4">📦 Résultat</h2>
      <pre id="output" class="bg-gray-900 p-4 rounded text-sm overflow-auto"></pre>
    </div>

  </div>

  <script>
    const bouton = document.getElementById('creer');
    const prompt = document.getElementById('prompt');
    const resultat = document.getElementById('resultat');
    const output = document.getElementById('output');

    bouton.addEventListener('click', async () => {
      const demande = prompt.value.trim();
      
      if (!demande) {
        alert('Décris ton app d\'abord !');
        return;
      }

      bouton.textContent = '⏳ Création en cours...';
      bouton.disabled = true;
      resultat.classList.remove('hidden');
      output.textContent = 'Chargement...';

      try {
        const response = await fetch('https://kenny-backend-lx76.onrender.com/api/users');
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = 'Erreur : ' + err.message;
      }

      bouton.textContent = '✨ Créer mon app';
      bouton.disabled = false;
    });
  </script>

</body>
</html>
